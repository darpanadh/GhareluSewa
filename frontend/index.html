<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gharelu_sewa_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gharelu Sewa - Local Service Platform</title>
    <meta name="description" content="Connect with trusted local service providers for all your household needs" />
    <meta name="theme-color" content="#07535f" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let reg of registrations) reg.unregister();
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => {
                console.log('[SW] Registered:', reg.scope);
                reg.update();
              })
              .catch(err => console.warn('[SW] Registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
